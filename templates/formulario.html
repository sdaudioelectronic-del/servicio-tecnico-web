<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orden de Servicio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>

<body>

    <div class="contenedor">

        <h1>Orden de Servicio Técnico</h1>

        <p class="descripcion">
            Complete los siguientes datos para registrar su equipo.
        </p>

        <form action="/guardar" method="POST" autocomplete="off">

            <input type="hidden" name="codigo" value="{{ codigo }}">

            <h2>Datos del cliente</h2>

            <label>Nombre completo</label>
            <input type="text" name="cliente" placeholder="Ingrese su nombre" autocomplete= "off" required
                oninvalid="this.setCustomValidity('Por favor, ingresa el nombre del cliente.')"
                oninput="this.setCustomValidity('')">

            <label>Número de teléfono</label>

            <input type="tel" name="telefono" placeholder="Ingrese su numero de teléfono" autocomplete="off" required
                oninvalid="this.setCustomValidity('Por favor, ingresa el número de teléfono.')"
                oninput="this.setCustomValidity('')">
        
            <label>Dirección</label>
            <input type="text" name="direccion" placeholder="Ingrese su dirección" autocomplete="off" required
                oninvalid="this.setCustomValidity('Por favor, ingrese dirección del cliente.')"
                oninput="this.setCustomValidity('')">

            <label>Tipo de equipo</label>
            <input type="text" name="equipo" placeholder="Ej: amplificador, cabina" autocomplete="off" required
                oninvalid="this.setCustomValidity('Por favor, ingrese equipo del cliente.')"
                oninput="this.setCustomValidity('')">

            <label>Marca</label>
            <input type="text" name="marca" placeholder="Ingrese la marca" autocomplete="off" required
                oninvalid="this.setCustomValidity('Por favor, ingrese la marca.')"
                oninput="this.setCustomValidity('')">
            

            <label>Modelo</label>
            <input type="text" name="modelo" placeholder="Ingrese el modelo" autocomplete="off" required
                oninvalid="this.setCustomValidity('Por favor, ingrese el modelo.')"
                oninput="this.setCustomValidity('')">

            <label>Falla reportada</label>
            <textarea name="falla" placeholder="Describa la falla del equipo" autocomplete="off" required></textarea
                oninvalid="this.setCustomValidity('Por favor, Describa la falla.')"
                oninput="this.setCustomValidity('')">
            


            <label>Observación</label>
            <textarea name="observacion" placeholder="Diagnostico y procedimiento" autocomplete="off" required></textarea
                oninvalid="this.setCustomValidity('Por favor, Describa el diagnostico y procedimiento.')"
                oninput="this.setCustomValidity('')">

            <label>Accesorios entregados</label>
            <textarea name="accesorios" placeholder="Ej: Control remoto, cable de corriente, etc." autocomplete="off"></textarea>


            <button type="submit">
            Continuar
            </button>

           

        </form>

    </div>

</body>
</html>
