<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orden de Servicio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>

<body>

    <div class="contenedor">

        <h1>Orden de Servicio Técnico</h1>

        <p class="descripcion">
            Complete los siguientes datos para registrar su equipo.
        </p>

        <form action="/guardar" method="POST">

            <h2>Datos del cliente</h2>

            <label>Nombre completo</label>
            <input type="text" name="cliente" placeholder="Ingrese su nombre" required>

            <label>Número de teléfono</label>
            <input type="tel" name="telefono" placeholder="Ingrese su teléfono" required>

            <label>Dirección</label>
            <input type="text" name="direccion" placeholder="Ingrese su dirección" required>

            <label>Tipo de equipo</label>
            <input type="text" name="equipo" placeholder="Ej: amplificador, cabina" required>

            <label>Marca</label>
            <input type="text" name="marca" placeholder="Ingrese la marca">

            <label>Modelo</label>
            <input type="text" name="modelo" placeholder="Ingrese el modelo">

            <label>Falla reportada</label>
            <textarea name="falla" placeholder="Describa la falla del equipo"></textarea>

            <label>Observación</label>
            <textarea name="observacion" placeholder="Diagnostico y procedimiento"></textarea>

            <label>Accesorios entregados</label>
            <textarea name="accesorios" placeholder="Ej: Control remoto, cable de corriente, etc."></textarea>

            <button type="submit">
            Continuar
            </button>

           

        </form>

    </div>

</body>
</html>
